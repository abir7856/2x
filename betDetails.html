<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <title>Document</title>
  </head>
  <body class="bg-[#eceff4] relative">
    <main class="w-full min-h-screen mx-auto relative no-scrollbar">
      <header
        class="fixed top-0 left-0 w-full z-40"
      >
        <div class="relative h-20 sm:h-28 md:h-[200px]">
          <img src="img/betdetails.jpg" alt="" class="absolute inset-0 w-full h-full object-cover" />

          <!-- তিন ডট বাটন -->
          <button
            id="menuBtn"
            class="text-blue-500 absolute right-5 top-[54px] z-30"
          >
            <svg
              width="10"
              height="20"
              viewBox="0 0 10 40"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="5" cy="5" r="4" fill="#598bca" />
              <circle cx="5" cy="20" r="4" fill="#598bca" />
              <circle cx="5" cy="35" r="4" fill="#598bca" />
            </svg>
          </button>
        </div>
      </header>

      <section class="no-scrollbar overflow-x-hidden bg-[#eceff4] pt-20 sm:pt-28 md:pt-[200px] pb-20 md:pb-[180px]">
        <!-- Loading screen -->
        <div
          id="loadingScreen"
          class="flex items-center justify-center h-[70vh] bg-[#eceff4]"
        >
          <span
            class="loading loading-spinner text-[#607f9c]"
            style="
              width: 2.5rem;
              height: 2.5rem;
              border-width: 3px;
              border-radius: 50%;
              border-color: #607f9c transparent #607f9c transparent;
            "
          ></span>
        </div>

        <img
          id="displayImage"
          class="pb-16 no-scrollbar hidden"
          src="img/Screenshot_20251017_101934_MelBet.jpg"
          alt="Click to change"
        />
        <input type="file" id="imageInput" accept="image/*" hidden />
      </section>

      <!-- নিচের fixed bottom section -->
      <section
        class="fixed bottom-0 w-full bg-white shadow-lg mx-auto z-50"
        id="bottom"
      >
        <div
          class="relative flex justify-around items-end h-16 md:h-[156px] pb-3 sm:pb-5 md:pb-6 shadow-top"
        >
          <!-- Bottom nav icons -->
          <a href="index.html">
            <div
              class="nav-item flex flex-col items-center active"
              data-name="popular"
              data-type="normal"
            >
              <img
                src="img/Bottom/popular.png"
                class="h-6 w-6 md:h-16 md:w-14 mb-1 sm:mb-2 nav-icon"
                alt="Popular"
              />
              <p class="text-xs md:text-lg font-medium nav-text text-[#5e809b]">
                Popular
              </p>
            </div>
          </a>

          <div class="nav-item flex flex-col items-center" data-name="fvrt">
            <img
              src="img/Bottom/fvrt.png"
              class="h-6 w-6 md:h-16 md:w-14 mb-1 sm:mb-2 nav-icon"
              alt="Favorites"
            />
            <p
              class="text-xs sm:text-xl md:text-3xl font-medium nav-text text-[#5e809b]"
            >
              Favorites
            </p>
          </div>

          <div class="nav-item flex flex-col items-center" data-name="mainB">
            <div
              class="relative -top-2 md:-top-6 rounded-full flex items-center justify-center shadow-lg betslip-icon sm:w-24 sm:h-24 md:w-32 md:h-32"
            >
              <img
                src="img/Bottom/mainB.png"
                class="w-12 h-12 md:w-30 md:h-30"
                alt="Bet slip"
              />
            </div>
            <p
              class="text-xs sm:text-xl md:text-3xl font-medium mt-1 sm:mt-2 nav-text text-[#5e809b]"
            >
              Bet slip
            </p>
          </div>

          <a href="betHistory.html">
            <div
              class="nav-item flex flex-col items-center"
              data-name="history"
            >
              <img
                src="img/Bottom/historyActv.png"
                class="h-6 w-6 md:h-16 md:w-14 mb-1 sm:mb-2 nav-icon"
                alt="History"
              />
              <p
                class="text-xs sm:text-xl md:text-3xl font-medium nav-text text-[#488cd2]"
              >
                History
              </p>
            </div>
          </a>

          <a href="menu.html">
            <div
              class="nav-item flex flex-col items-center"
              data-name="menu"
              data-type="normal"
            >
              <img
                src="img/Bottom/menu.png"
                class="h-6 w-6 md:h-16 md:w-14 mb-1 sm:mb-2 nav-icon"
                alt="Menu"
              />
              <p
                class="text-xs sm:text-xl md:text-3xl font-medium nav-text text-[#5e809b]"
              >
                Menu
              </p>
            </div>
          </a>
        </div>
      </section>
    </main>

    <!-- Modal Overlay (moved outside header) -->
    <div
      id="modalOverlay"
      class="fixed inset-0 bg-black/50 hidden transition-opacity duration-300 z-40"
    ></div>

    <!-- Bottom Sheet Modal (moved outside header) -->
    <div
      id="bottomModal"
      class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-lg transform translate-y-full transition-transform duration-300 z-50"
    >
      <div class="w-16 h-1.5 bg-gray-300 rounded-full mx-auto mt-3"></div>
      <div class="text-center font-semibold text-lg mt-2 mb-3">Select</div>
      <hr />
      <div class="p-4 space-y-4">
        <button
          id="copyBtn"
          class="flex items-center space-x-3 text-gray-700 w-full text-left"
        >
          <img class="w-6 h-6" src="img/copyBetSlip.png" alt="" />
          <span>Copy bet slip number</span>
        </button>

        <button
          id="hideBtn"
          class="flex items-center space-x-3 text-gray-700 w-full text-left"
        >
          <img class="w-6 h-6" src="img/hideBet.png" alt="" />
          <span>Hide bet</span>
        </button>
      </div>
    </div>

    <script>
      const menuBtn = document.getElementById("menuBtn");
      const modal = document.getElementById("bottomModal");
      const overlay = document.getElementById("modalOverlay");
      const loadingScreen = document.getElementById("loadingScreen");
      const img = document.getElementById("displayImage");
      const fileInput = document.getElementById("imageInput");
      // Resolve current bet context from localStorage (set by betHistory.js)
      const currentBetRaw = localStorage.getItem("currentBetDetails");
      let currentBet = null;
      let betId = "unknown";
      try {
        if (currentBetRaw) {
          currentBet = JSON.parse(currentBetRaw);
          if (currentBet && typeof currentBet.id !== "undefined") {
            betId = String(currentBet.id);
          }
          // Clear after use to avoid stale data
          localStorage.removeItem("currentBetDetails");
        }
      } catch (e) {
        console.error("Failed to parse currentBetDetails:", e);
      }

      // Per-bet image storage key
      const STORAGE_KEY = `savedImage_bet_${betId}`;

      // Show loading screen first
      loadingScreen.classList.remove("hidden");
      img.classList.add("hidden");

      menuBtn.addEventListener("click", () => {
        modal.classList.remove("translate-y-full");
        overlay.classList.remove("hidden");
      });

      overlay.addEventListener("click", () => {
        modal.classList.add("translate-y-full");
        overlay.classList.add("hidden");
      });

      // Load saved image if exists
      const savedImage = localStorage.getItem(STORAGE_KEY);
      if (savedImage) {
        img.src = savedImage;
      }

      // Show image after loading delay (1.5 seconds)
      setTimeout(() => {
        loadingScreen.classList.add("hidden");
        img.classList.remove("hidden");
      }, 1500);

      img.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          // Show loading when changing image
          loadingScreen.classList.remove("hidden");
          img.classList.add("hidden");

          const reader = new FileReader();
          reader.onload = (event) => {
            const imageData = event.target.result;
            img.src = imageData;
            localStorage.setItem(STORAGE_KEY, imageData);

            // Show image after loading delay
            setTimeout(() => {
              loadingScreen.classList.add("hidden");
              img.classList.remove("hidden");
            }, 1500);
          };
          reader.readAsDataURL(file);
        }
      });
      // ------------------------------
      // 🎯 BET SLIP FEATURE SECTION
      // ------------------------------
      const hideBtn = document.getElementById("hideBtn");
      const copyBtn = document.getElementById("copyBtn");

      // Bet slip number localStorage key
      const BET_KEY = "betSlipNumber";

      // ✅ Hide Bet (save number)
      hideBtn.addEventListener("click", () => {
        const number = prompt("Enter your Bet Slip Number:");
        if (number) {
          localStorage.setItem(BET_KEY, number);
          alert("✅ Bet slip number saved successfully!");

          // Optionally map slip number to this bet's page for later lookup
          const pageName = `bet_${betId}.html`;
          localStorage.setItem(number, pageName);
        }
      });

      // ✅ Copy Bet Slip Number
      copyBtn.addEventListener("click", () => {
        const number = localStorage.getItem(BET_KEY);
        if (!number) {
          alert("⚠️ No bet slip number saved yet!");
          return;
        }

        // Copy to clipboard with WebView-friendly fallback
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(number);
        } else {
          const tmp = document.createElement("textarea");
          tmp.value = number;
          document.body.appendChild(tmp);
          tmp.select();
          try {
            document.execCommand("copy");
          } catch (err) {
            console.warn("Clipboard copy fallback failed:", err);
          }
          document.body.removeChild(tmp);
        }

        // Close modal and overlay (like 1xBet)
        modal.classList.add("translate-y-full");
        overlay.classList.add("hidden");
      });
    </script>
  </body>
</html>
