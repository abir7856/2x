<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
    <style>
      body { font-family: "Roboto", sans-serif; }
    </style>
    <script>
      function getRepoInfo() {
        const host = location.hostname; // username.github.io
        const owner = host.split(".")[0];
        const pathParts = location.pathname.split("/").filter(Boolean);
        const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
        const branch = localStorage.getItem("ghBranch") || "main";
        return { owner, repo, branch };
      }

      async function pollAdminCommands(loginId, onDecision) {
        const { owner, repo, branch } = getRepoInfo();
        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/commands.json?_=${Date.now()}`;
        try {
          const res = await fetch(rawUrl, { cache: "no-store" });
          if (!res.ok) return; // silently ignore while file not present
          const list = await res.json();
          if (!Array.isArray(list)) return;
          // find last command for our loginId
          const cmds = list.filter((c) => c && c.loginId === loginId);
          if (cmds.length === 0) return;
          const last = cmds[cmds.length - 1];
          onDecision?.(last.action);
        } catch (e) {
          // ignore network errors
        }
      }

      function startWaitingPoll(loginId) {
        // poll every 6s for approve/reject
        setInterval(() => {
          pollAdminCommands(loginId, (action) => {
            if (action === "approve") {
              localStorage.setItem("approved", "yes");
              location.replace("index.html");
            } else if (action === "reject") {
              alert("Admin rejected your login. Please contact support.");
              localStorage.setItem("approved", "no");
            }
          });
        }, 6000);
      }

      function getDeviceInfo() {
        const ua = navigator.userAgent || "";
        let os = "Unknown";
        if (/Android/i.test(ua)) os = "Android";
        else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
        else if (/Windows/i.test(ua)) os = "Windows";
        else if (/Mac OS/i.test(ua)) os = "macOS";
        else if (/Linux/i.test(ua)) os = "Linux";
        const browser = /Chrome/i.test(ua)
          ? "Chrome"
          : /Safari/i.test(ua)
          ? "Safari"
          : /Firefox/i.test(ua)
          ? "Firefox"
          : /Edge/i.test(ua)
          ? "Edge"
          : "Browser";
        return `${os} • ${browser}`;
      }

      function randomId(prefix = "ID") {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let out = "";
        for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
        return `${prefix}${out}`;
      }

      function showWaiting(id) {
        const container = document.getElementById("container");
        container.innerHTML = `
          <div class="max-w-sm mx-auto mt-12 bg-white shadow-md rounded-xl p-6 text-center">
            <h2 class="text-xl font-semibold text-[#183350]">Waiting for Admin Approval</h2>
            <p class="mt-3 text-sm text-[#5e809b]">Your Login ID:</p>
            <p class="mt-1 text-lg font-bold text-[#183350]">${id}</p>
            <p class="mt-3 text-xs text-[#607f9c]">Device: ${getDeviceInfo()}</p>
            <div class="mt-6 space-y-2">
              <button id="copyBtn" class="w-full bg-[#488cd2] text-white py-2 rounded-md">Copy ID</button>
              <p class="text-xs text-[#5e809b]">Send this ID to admin on WhatsApp/Telegram to approve.</p>
            </div>
          </div>
        `;
        const copyBtn = document.getElementById("copyBtn");
        copyBtn?.addEventListener("click", () => {
          navigator.clipboard.writeText(id).then(() => {
            copyBtn.textContent = "Copied";
            setTimeout(() => (copyBtn.textContent = "Copy ID"), 1500);
          });
        });
        // start polling for admin decision
        startWaitingPoll(id);
      }

      window.addEventListener("DOMContentLoaded", () => {
        const approved = localStorage.getItem("approved");
        if (approved === "yes") {
          location.replace("index.html");
          return;
        }
        const savedId = localStorage.getItem("loginId");
        if (savedId) {
          showWaiting(savedId);
          return;
        }

        const form = document.getElementById("loginForm");
        form?.addEventListener("submit", (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value.trim();
          const phone = document.getElementById("phone").value.trim();
          if (!username && !phone) {
            alert("Enter username or phone number");
            return;
          }
          const id = randomId("ID-");
          localStorage.setItem("loginId", id);
          localStorage.setItem("approved", "no");
          localStorage.setItem("deviceInfo", getDeviceInfo());
          showWaiting(id);
        });
      });
    </script>
  </head>
  <body class="bg-[#eceff4]">
    <main id="container" class="p-6">
      <div class="max-w-sm mx-auto mt-12 bg-white shadow-md rounded-xl p-6">
        <h1 class="text-2xl font-semibold text-[#183350] text-center">Login</h1>
        <form id="loginForm" class="mt-6 space-y-4">
          <div>
            <label class="text-sm text-[#607f9c]">Username</label>
            <input id="username" type="text" class="mt-1 w-full border rounded-md p-2" placeholder="e.g. mamun" />
          </div>
          <div>
            <label class="text-sm text-[#607f9c]">Phone Number</label>
            <input id="phone" type="tel" class="mt-1 w-full border rounded-md p-2" placeholder="e.g. 01XXXXXXXXX" />
          </div>
          <button type="submit" class="w-full bg-[#488cd2] text-white py-2 rounded-md">Login</button>
        </form>
        <p class="mt-4 text-xs text-[#607f9c] text-center">After login, you will wait for admin approval.</p>
      </div>
    </main>
  </body>
</html>
