<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin Approval</title>
    <style> body { font-family: "Roboto", sans-serif; } </style>
    <script>
      const SECRET = "ALEX-SECRET-314"; // keep this page secret

      function makeSig(id) {
        return btoa(`${id}|${SECRET}`);
      }

      function buildLink(id) {
        const sig = makeSig(id);
        const url = new URL(location.origin + location.pathname.replace(/admin\.html$/, "approve.html"));
        url.searchParams.set("id", id);
        url.searchParams.set("sig", sig);
        return url.toString();
      }

      window.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("form");
        const out = document.getElementById("out");
        const rejectOut = document.getElementById("rejectOut");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const id = document.getElementById("loginId").value.trim();
          if (!id) return;
          const link = buildLink(id);
          const rejectLink = new URL(link);
          rejectLink.searchParams.set("reject", "1");
          out.value = link;
          rejectOut.value = rejectLink.toString();
        });
      });
    </script>
  </head>
  <body class="bg-[#eceff4]">
    <main class="max-w-lg mx-auto mt-12 bg-white shadow-md rounded-xl p-6">
      <h1 class="text-2xl font-semibold text-[#183350]">Admin Approval</h1>
      <p class="mt-2 text-sm text-[#607f9c]">Enter the user's Login ID to generate an approval link. Share the link with the user via WhatsApp/Telegram.</p>
      <form id="form" class="mt-6 space-y-4">
        <div>
          <label class="text-sm text-[#607f9c]">Login ID</label>
          <input id="loginId" type="text" class="mt-1 w-full border rounded-md p-2" placeholder="e.g. ID-ABC123" />
        </div>
        <button type="submit" class="bg-[#488cd2] text-white px-4 py-2 rounded-md">Generate Link</button>
      </form>
      <div class="mt-6">
        <label class="text-sm text-[#607f9c]">Approval Link</label>
        <input id="out" class="mt-1 w-full border rounded-md p-2" readonly />
      </div>
      <div class="mt-4">
        <label class="text-sm text-[#607f9c]">Reject Link</label>
        <input id="rejectOut" class="mt-1 w-full border rounded-md p-2" readonly />
      </div>
      <p class="mt-4 text-xs text-[#5e809b]">Keep this page URL secret.</p>
    </main>
  </body>
</html>
